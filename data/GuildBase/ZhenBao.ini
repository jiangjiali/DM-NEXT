;行会珍宝阁/极品阁配置
;------------------------------------------
;一、开放规则:
;   MinTowerLevel  : 行会宝塔等级门槛(低于则0x0343 type0回msg+9=1封闭)
;   DailyCost      : 每日从行会公共银两扣除的维持费(不足当日封闭)
;   PersonDailyLimit: 每位成员每日可开珍宝阁格数(0点重置)
;   TowerColumn    : 珍宝阁第6..10列所需宝塔等级(第0..5列仅需MinTowerLevel)
;二、极品阁:
;   EnterDailyLimit: 每人每日进极品阁次数(进一次扣1个灵皓石)
;   SkeletonRate   : 开极品阁格遇骷髅(无奖)概率百分比
;   Pool36         : 极品阁奖池(物品名,数量,权重)
;三、珍宝阁77格奖池(按权重百分比, 列越高经验/物品越好):
;   DoorRate=门格(进极品阁)概率, ExpRate=经验概率, 其余=物品概率
;   ItemBase: 第0..5列物品池; ItemHigh: 第6..10列追加的高级物品池
;   物品名须与服务端物品库BaseItem.csv一致
;------------------------------------------
[Open]
MinTowerLevel=1
DailyCost=0
PersonDailyLimit=3
TowerColumn=10,30,50,70,90
[JipinGe]
EnterDailyLimit=1
SkeletonRate=25
Pool36=金条,5,2;神秘宝箱,2,2;神秘钥匙,1,1;灵符,5,1;金条,10,1
[Pool77]
DoorRate=3
ExpRate=50
ExpLow=100000
ExpMid=300000
ExpHigh=1000000
ItemBase=金条,1,10;金创药(大量),1,3;魔法药(大量),1,3;木材,5,5;铁矿,10,5
ItemHigh=金条,3,2;神秘宝箱,1,2;灵符,2,1;铁血令,1,1;灵皓石,1,1
