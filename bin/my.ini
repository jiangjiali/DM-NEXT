# =============================================================================
#  my.ini : 传世 DMServer 专用 MySQL 5.7.44 配置 (InnoDB 版)
#  档位 A: 约 100 人在线, 建议机器内存 4GB
#
#  [和 MyISAM 版的区别] 业务表迁到 InnoDB 后 (先执行 migrate-to-innodb.sql):
#   1) 内存主力从 key_buffer_size 换成 innodb_buffer_pool_size。整个库只有
#      几十 MB (1000 角色量级), 256M 足够把数据+索引全缓存进内存。
#   2) 去掉 delay_key_write / concurrent_insert / myisam_recover_options /
#      default-storage-engine=MyISAM, 这些是 MyISAM 专用写优化。
#   3) 新增 innodb_lock_wait_timeout: MyISAM 是表级锁排队, InnoDB 换成行锁后
#      等锁超过这个秒数会报错返回(默认 50 秒太长, 会把 DB 查询线程堵死)。
#   4) 新增 innodb_print_all_deadlocks: 行锁可能死锁, 让它写进错误日志。
#   5) key_buffer_size 降到 32M: MySQL 5.7 的 mysql 系统库表仍然是 MyISAM,
#      只需要一点索引缓存。
#
#  [为什么 InnoDB 才对] AppDB.cpp:120 的延迟写入本来就用
#      START TRANSACTION ... ROLLBACK ... COMMIT 包住一批 SQL (141/155/175 行);
#      "先删后插"快照 (AppDB.cpp:1002) 和 FindItemId 的两步操作 (AppDB.cpp:865)
#      也都需要原子性 —— MyISAM 让这些事务语义全部空转。换成 InnoDB 后才真正
#      生效, 掉电也不会再出现"删了没插上=丢装备 / 插了没删净=复制装备"。
#
#  [怎么用] 见同目录 InnoDB迁移说明.md。必须: 停服 -> 备份 -> 换 my.ini ->
#           执行 migrate-to-innodb.sql -> 启动验证。
# =============================================================================

[mysqld]
datadir="..\Data\MySQL"
bind-address=localhost
port=8306

character-set-server=gb2312
collation-server=gb2312_chinese_ci

# ===================== InnoDB 内存(迁移后的主力) =====================
# 库很小, 256M 能全装下; 硬件有余量可继续加大, 收益有限。
innodb_buffer_pool_size = 256M
innodb_buffer_pool_instances = 1
# redo log: 越大 checkpoint 越少、写越顺, 但崩溃恢复也越慢。
# 128M x 2 组 = 256M 磁盘, 适合小机器。
innodb_log_file_size = 128M
innodb_log_files_in_group = 2
# 延迟写入是"一批 SQL 一个大事务"(AppDB.cpp:120), 日志缓冲给大一点减少刷写。
innodb_log_buffer_size = 32M
# 每 5 秒每连接一次 COMMIT, 100 在线约 20 次/秒, 机械盘也扛得住,
# 所以这里用最安全的 1(每次提交都落盘)。人数上到几百再用 2。
# 以后若把角色表改回 MyISAM 或用 2, 请重读 InnoDB迁移说明.md 的取舍说明。
innodb_flush_log_at_trx_commit = 1
innodb_autoextend_increment = 8
innodb_file_per_table = ON
innodb_thread_concurrency = 0
# 行锁等待上限(秒)。超时只回滚当前语句并返回错误, 不会永久卡住查询线程。
innodb_lock_wait_timeout = 15
# 死锁写进 MySQL 错误日志, 便于定位(配合 SHOW ENGINE INNODB STATUS)。
innodb_print_all_deadlocks = ON
# ---- 磁盘相关的可选调整(默认值适用机械盘) ----
# SSD 建议: innodb_io_capacity = 2000 / innodb_io_capacity_max = 4000 /
#           innodb_flush_neighbors = 0
# innodb_io_capacity = 2000

# ===================== 连接数: 按在线人数(约 100)算 =====================
# max_connections = 在线人数 + QueryThreads(4) + 主线程(1) + 约 20% 余量
max_connections = 128
# 所有游戏服连接都用同一个账号 (Config.ini 的 DbAccount=woool),
# 留 8 条给 root/GM 工具。不要配成 45 这种小家子气的值。
max_user_connections = 120
# 连接池会回收空闲连接再重建 (DBConnectionPool.cpp:143 Maintain)。
thread_cache_size = 16
# InnoDB 每张打开的表占 1 个文件句柄(MyISAM 是 2 个), 这里仍按
# "每连接 2-3 张表"给, 避免反复 open/close 表。
table_open_cache = 512
table_definition_cache = 256
table_open_cache_instances = 1
# 只给 mysql 系统库(5.7 仍是 MyISAM 表)用, 不再是业务表的主力缓存。
key_buffer_size = 32M
key_cache_block_size = 4096
# 专属连接无保活，不让服务端先杀
wait_timeout = 31536000
interactive_timeout = 31536000

# ===================== 每连接缓冲(乘上连接数会放大, 别贪) =====================
sort_buffer_size = 512K
join_buffer_size = 256K
read_buffer_size = 256K
read_rnd_buffer_size = 128K
tmp_table_size = 16M
max_heap_table_size = 16M
max_allowed_packet = 16M

# ===================== 查询缓存: 关掉 =====================
query_cache_type = 0
query_cache_size = 0

# ===================== 稳定性 / 兼容 =====================
performance_schema = OFF
lower_case_table_names = 1
explicit_defaults_for_timestamp = ON
# 5.7 默认严格模式会让老代码插入报错(超长字符串、零日期、非标准 GROUP BY),
# 这里放宽; 代价是超长字符串被静默截断。
# 想要严格报错就改成: sql_mode = STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
sql_mode = NO_ENGINE_SUBSTITUTION
max_connect_errors = 1000
skip-log-bin
sync_binlog = 0
slow_query_log = 1
long_query_time = 1

# ---- 可选开关(默认不开) ----
# skip-name-resolve
# local_infile = OFF

[mysql]
default-character-set=gb2312
max_allowed_packet=16M

[client]
port=8306
default-character-set=gb2312
